name: Bump version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      level:
        description: Semver level to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: bump-version-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.actor != 'github-actions[bot]' &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bump version
        id: bump
        env:
          BUMP_LEVEL: ${{ inputs.level || 'patch' }}
        run: |
          bun run version:bump -- "$BUMP_LEVEL"
          echo "version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --staged --quiet; then
            echo "No version change to commit"
            exit 0
          fi
          version="${{ steps.bump.outputs.version }}"
          git commit -m "chore(release): v${version}"
          git push
