name: exam-platform

services:
  app:
    image: ${DOCKER_IMAGE:-brofrong/exam-platform}:${DOCKER_TAG:-latest}
    pull_policy: always
    container_name: exam-platform-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      ZERO_UPSTREAM_DB: postgres://postgres:${POSTGRES_PASSWORD:-pass}@zero-postgres:5432/zero
      ZERO_CACHE_UPSTREAM_URL: http://zero-cache:4848
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-exam-platform-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      zero-postgres:
        condition: service_healthy
      zero-cache:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - proxy
      - exam-network

  zero-cache:
    image: rocicorp/zero:1.8.0
    container_name: exam-platform-cache
    restart: unless-stopped
    stop_grace_period: 10m
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:${POSTGRES_PASSWORD:-pass}@zero-postgres:5432/zero
      ZERO_CVR_DB: postgres://postgres:${POSTGRES_PASSWORD:-pass}@zero-postgres:5432/zero
      ZERO_CHANGE_DB: postgres://postgres:${POSTGRES_PASSWORD:-pass}@zero-postgres:5432/zero
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:-change-me}
      ZERO_QUERY_URL: http://app:3000/api/query
      ZERO_MUTATE_URL: http://app:3000/api/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
    volumes:
      - zero-cache-data:/data
    depends_on:
      zero-postgres:
        condition: service_healthy
    networks:
      - exam-network

  zero-postgres:
    image: postgres:18
    container_name: exam-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - zero-postgres-data:/var/lib/postgresql
    command: postgres -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-network

  minio:
    image: minio/minio:latest
    container_name: exam-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - exam-network

  minio-init:
    image: minio/mc:latest
    container_name: exam-platform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET_UPLOADS &&
      echo 'bucket ready'
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-exam-platform-uploads}
    restart: "no"
    networks:
      - exam-network

volumes:
  zero-cache-data:
  zero-postgres-data:
  minio-data:

networks:
  proxy:
    external: true
  exam-network:
    driver: bridge
