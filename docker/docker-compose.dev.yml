name: exam-platform-dev

services:
  zero-cache:
    image: rocicorp/zero:1.8.0
    container_name: zero-cache
    stop_grace_period: 10m
    depends_on:
      zero-postgres:
        condition: service_healthy
    ports:
      - "4848:4848"
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@zero-postgres:5432/zero
      ZERO_CVR_DB: postgres://postgres:pass@zero-postgres:5432/zero
      ZERO_CHANGE_DB: postgres://postgres:pass@zero-postgres:5432/zero
      # Path to the SQLite replica
      ZERO_REPLICA_FILE: /data/replica.db
      # Password used to access the inspector and /statz
      ZERO_ADMIN_PASSWORD: randompassword
      ZERO_QUERY_URL: http://host.docker.internal:3000/api/query
      ZERO_MUTATE_URL: http://host.docker.internal:3000/api/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zero-cache-data:/data

  zero-postgres:
    image: postgres:18
    container_name: zero-postgres
    environment:
      POSTGRES_DB: zero
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    command: postgres -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/exam-platform-uploads &&
      echo 'bucket ready: exam-platform-uploads'
      "
    restart: "no"

volumes:
  zero-cache-data:
    driver: local
  minio-data:
    driver: local
