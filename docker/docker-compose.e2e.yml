name: exam-platform-e2e

services:
  zero-cache-e2e:
    image: rocicorp/zero:1.8.0
    container_name: zero-cache-e2e
    stop_grace_period: 10m
    depends_on:
      zero-postgres-e2e:
        condition: service_healthy
    ports:
      - "4849:4848"
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@zero-postgres-e2e:5432/zero
      ZERO_CVR_DB: postgres://postgres:pass@zero-postgres-e2e:5432/zero
      ZERO_CHANGE_DB: postgres://postgres:pass@zero-postgres-e2e:5432/zero
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: e2epassword
      ZERO_QUERY_URL: http://host.docker.internal:3100/api/query
      ZERO_MUTATE_URL: http://host.docker.internal:3100/api/mutate
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zero-cache-e2e-data:/data

  zero-postgres-e2e:
    image: postgres:18
    container_name: zero-postgres-e2e
    environment:
      POSTGRES_DB: zero
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    command: postgres -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-e2e:
    image: minio/minio:latest
    container_name: minio-e2e
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-e2e-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-e2e-init:
    image: minio/mc:latest
    container_name: minio-e2e-init
    depends_on:
      minio-e2e:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-e2e:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/exam-platform-uploads &&
      echo 'bucket ready: exam-platform-uploads'
      "
    restart: "no"

volumes:
  zero-cache-e2e-data:
    driver: local
  minio-e2e-data:
    driver: local
